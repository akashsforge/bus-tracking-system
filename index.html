<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Public Bus Tracker</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f4f6f9;
        }

        header {
            background-color: #1a252f;
            color: #ffffff;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        header h1 {
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            background-color: #27ae60;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .main-container {
            display: flex;
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #sidebar {
            width: 340px;
            background-color: #ffffff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            z-index: 500;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
        }

        .search-box {
            padding: 15px;
            border-bottom: 1px solid #eeeeee;
            background-color: #fafafa;
        }

        .search-box input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            font-size: 0.9rem;
        }

        .search-box input:focus {
            border-color: #3498db;
        }

        .location-hint {
            font-size: 0.72rem;
            color: #999;
            margin-top: 6px;
        }

        .match-banner {
            display: none;
            padding: 12px 15px;
            background-color: #eafaf1;
            border-bottom: 1px solid #a9dfbf;
            color: #1e8449;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .match-banner.show { display: block; }

        .bus-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .bus-card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .bus-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
        }

        .bus-card.matched {
            border: 2px solid #27ae60;
            background-color: #f4fdf7;
        }

        .match-tag {
            display: inline-block;
            background-color: #27ae60;
            color: #fff;
            font-size: 0.68rem;
            font-weight: bold;
            padding: 2px 7px;
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .bus-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .bus-title {
            font-weight: bold;
            color: #2c3e50;
            font-size: 1rem;
        }

        .route-name {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-bottom: 4px;
        }

        .distance-info {
            font-size: 0.8rem;
            color: #2980b9;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .occupancy-container {
            margin-top: 8px;
        }

        .occupancy-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #555;
            margin-bottom: 4px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #edf2f7;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background-color: #27ae60;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        #map {
            flex: 1;
            height: 100%;
            width: 100%;
        }

        .empty-state {
            text-align: center;
            color: #888;
            font-size: 0.9rem;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column-reverse;
            }
            #sidebar {
                width: 100%;
                height: 45%;
            }
            #map {
                height: 55%;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🚍 Live Transport Dashboard</h1>
        <span class="status-badge" id="systemStatus">System Live</span>
    </header>

    <div class="main-container">
        <div id="sidebar">
            <div class="search-box">
                <input type="text" id="destinationInput" placeholder="Where are you headed? e.g. Guruvayur" oninput="filterBuses()">
                <div class="location-hint" id="locationHint">Locating you…</div>
            </div>
            <div class="match-banner" id="matchBanner"></div>
            <div class="bus-list" id="busList">
                <div class="empty-state">Fetching active buses...</div>
            </div>
        </div>
        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Endpoint configuration
        const API_ENDPOINT = 'https://akash154.app.n8n.cloud/webhook/search-buses';

        // Map setup centered over Thrissur
        const map = L.map('map').setView([10.5280, 76.2150], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Custom Bus Icon
        const busIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3448/3448339.png',
            iconSize: [36, 36],
            iconAnchor: [18, 18],
            popupAnchor: [0, -18]
        });

        // Matched Bus Icon (highlighted)
        const busIconMatched = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3448/3448339.png',
            iconSize: [46, 46],
            iconAnchor: [23, 23],
            popupAnchor: [0, -23],
            className: 'matched-bus-icon'
        });

        // User Location Icon
        const userIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/9131/9131526.png',
            iconSize: [32, 32],
            iconAnchor: [16, 16]
        });

        let markers = {};
        let activeBusesData = [];
        let userLocation = null; // { lat, lng }

        // ---------------------------------------------------------------
        // Haversine distance in km between two lat/lng points
        // ---------------------------------------------------------------
        function distanceKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        // 1. Locate & continuously track the user on the map
        let userMarker = null;
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                position => {
                    userLocation = { lat: position.coords.latitude, lng: position.coords.longitude };
                    document.getElementById('locationHint').textContent = "📍 Your location is being tracked";

                    if (userMarker) {
                        userMarker.setLatLng([userLocation.lat, userLocation.lng]);
                    } else {
                        userMarker = L.marker([userLocation.lat, userLocation.lng], { icon: userIcon })
                            .addTo(map)
                            .bindPopup("<b>You are here</b>");
                        map.setView([userLocation.lat, userLocation.lng], 14);
                    }
                    // Re-render so distance-to-bus figures stay current
                    updateUI(activeBusesData);
                },
                error => {
                    document.getElementById('locationHint').textContent = "Location unavailable — enable GPS for distance info";
                    console.warn("Geolocation denied or unavailable:", error.message);
                },
                { enableHighAccuracy: true }
            );
        } else {
            document.getElementById('locationHint').textContent = "Geolocation not supported by this browser";
        }

        // 2. Fetch Active Bus Data
        async function fetchBuses() {
            try {
                const response = await fetch(API_ENDPOINT);
                const data = await response.json();

                // Handle both raw arrays or objects containing array properties
                activeBusesData = Array.isArray(data) ? data : (data.data || []);

                updateUI(activeBusesData);
                document.getElementById('systemStatus').innerText = "System Live";
                document.getElementById('systemStatus').style.backgroundColor = "#27ae60";
            } catch (error) {
                console.error("Error fetching bus telemetry:", error);
                document.getElementById('systemStatus').innerText = "Offline";
                document.getElementById('systemStatus').style.backgroundColor = "#e74c3c";
            }
        }

        // Does this trip's destination match what the passenger typed?
        function matchesDestination(trip, searchTerm) {
            if (!searchTerm) return false;
            const destination = (trip.destination || '').toLowerCase();
            const routeName = (trip.route_name || trip.routes?.route_name || '').toLowerCase();
            return destination.includes(searchTerm) || routeName.includes(searchTerm);
        }

        // 3. Render Markers & Sidebar Cards
        function updateUI(buses) {
            const busListEl = document.getElementById('busList');
            const bannerEl = document.getElementById('matchBanner');
            const searchTerm = document.getElementById('destinationInput').value.toLowerCase().trim();

            // Tag every bus with whether it matches, then sort matches first
            const annotated = buses.map(trip => ({
                trip,
                matched: matchesDestination(trip, searchTerm)
            })).sort((a, b) => (b.matched - a.matched));

            const anyMatched = annotated.some(a => a.matched);

            if (searchTerm && anyMatched) {
                bannerEl.textContent = "🚌 Bus found heading your way!";
                bannerEl.classList.add('show');
            } else if (searchTerm && !anyMatched) {
                bannerEl.textContent = "No active bus currently covers that destination.";
                bannerEl.classList.add('show');
                bannerEl.style.backgroundColor = "#fdecea";
                bannerEl.style.color = "#c0392b";
            } else {
                bannerEl.classList.remove('show');
                bannerEl.style.backgroundColor = "";
                bannerEl.style.color = "";
            }
            if (searchTerm && anyMatched) {
                bannerEl.style.backgroundColor = "";
                bannerEl.style.color = "";
            }

            // When searching, only list matches; otherwise show everything
            const listToRender = searchTerm ? annotated.filter(a => a.matched) : annotated;

            if (listToRender.length === 0) {
                busListEl.innerHTML = searchTerm
                    ? `<div class="empty-state">No active buses matching "${searchTerm}".</div>`
                    : `<div class="empty-state">No active buses right now.</div>`;
            } else {
                busListEl.innerHTML = '';
            }

            // Track active IDs to clear stale markers (all buses stay on map, matched or not)
            const currentTripIds = new Set();

            annotated.forEach(({ trip, matched }) => {
                const tripId = trip.id || trip.bus_id;
                currentTripIds.add(tripId);

                const lat = parseFloat(trip.current_lat);
                const lng = parseFloat(trip.current_lng);
                const busNickname = trip.buses?.bus_name || trip.bus_name || '';
                const plateNumber = trip.buses?.plate_number || trip.plate_number || trip.buses?.bus_number || '';
                const busName = busNickname && plateNumber
                    ? `${busNickname} (${plateNumber})`
                    : (busNickname || plateNumber || "Express Bus");
                const routeName = trip.route_name || trip.routes?.route_name || "Active Route";
                const occupancy = trip.current_occupancy || 0;
                const capacity = trip.buses?.total_capacity || 40;
                const fillPercent = Math.min(Math.round((occupancy / capacity) * 100), 100);

                let dist = null;
                if (userLocation && !isNaN(lat) && !isNaN(lng)) {
                    dist = distanceKm(userLocation.lat, userLocation.lng, lat, lng);
                }

                // Determine occupancy bar color
                let barColor = "#27ae60"; // Green
                if (fillPercent > 80) barColor = "#e74c3c"; // Red
                else if (fillPercent > 50) barColor = "#f39c12"; // Yellow

                // Update or Create Map Marker (always visible on map regardless of search)
                const icon = matched ? busIconMatched : busIcon;
                if (markers[tripId]) {
                    markers[tripId].setLatLng([lat, lng]);
                    markers[tripId].setIcon(icon);
                } else {
                    markers[tripId] = L.marker([lat, lng], { icon })
                        .addTo(map)
                        .bindPopup(`
                            <b>${busName}</b><br>
                            Route: ${routeName}<br>
                            Occupancy: ${occupancy} / ${capacity} passengers
                        `);
                }

                // Only list matched buses when the user is searching
                if (searchTerm && !matched) return;

                const card = document.createElement('div');
                card.className = matched ? 'bus-card matched' : 'bus-card';
                card.onclick = () => {
                    map.flyTo([lat, lng], 15, { duration: 1.2 });
                    markers[tripId].openPopup();
                };

                card.innerHTML = `
                    ${matched ? '<div class="match-tag">✓ MATCHES YOUR DESTINATION</div>' : ''}
                    <div class="bus-header">
                        <span class="bus-title">🚌 ${busName}</span>
                    </div>
                    <div class="route-name">📍 ${routeName}</div>
                    ${dist !== null ? `<div class="distance-info">${dist.toFixed(1)} km from you</div>` : ''}
                    <div class="occupancy-container">
                        <div class="occupancy-text">
                            <span>Occupancy</span>
                            <span><b>${occupancy}</b> / ${capacity} (${fillPercent}%)</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${fillPercent}%; background-color: ${barColor};"></div>
                        </div>
                    </div>
                `;
                busListEl.appendChild(card);
            });

            // Remove markers for buses no longer active
            Object.keys(markers).forEach(id => {
                if (!currentTripIds.has(id)) {
                    map.removeLayer(markers[id]);
                    delete markers[id];
                }
            });
        }

        function filterBuses() {
            updateUI(activeBusesData);
        }

        // Initial Execution & 5-Second Polling Loop
        fetchBuses();
        setInterval(fetchBuses, 5000);
    </script>
</body>
</html>
